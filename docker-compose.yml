services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DB_DATA_DIR}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ${CONTAINER_NAME_BACKEND}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      SEED_SA_EMAIL: ${SEED_SA_EMAIL}
      SEED_SA_PASSWORD: ${SEED_SA_PASSWORD}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE}
    volumes:
      - ${UPLOADS_DATA_DIR}:/app/uploads
      - ${BACKUP_DIR}/status:/backup-status:ro
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${BACKEND_PORT}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ${CONTAINER_NAME_FRONTEND}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${FRONTEND_PORT}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_PROMETHEUS}
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL}"
    volumes:
      - ${PROMETHEUS_DATA_DIR}:/prometheus
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_GRAFANA}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_USERS_ALLOW_SIGN_UP}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_SECURITY_COOKIE_SECURE}
      GF_SERVER_ROOT_URL: ${GRAFANA_SERVER_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVER_SERVE_FROM_SUB_PATH}
    volumes:
      - ${GRAFANA_DATA_DIR}:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  node-exporter:
    build:
      context: ./node-exporter
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_NODE_EXPORTER}
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/backup-status"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ${BACKUP_DIR}/status:/backup-status:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres-exporter:
    build:
      context: ./postgres-exporter
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_POSTGRES_EXPORTER}
    restart: unless-stopped
    command:
      # v0.16.0 queries pg_stat_bgwriter columns that PostgreSQL 17 moved to pg_stat_checkpointer
      - "--no-collector.stat_bgwriter"
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME}
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_BACKUP}
    restart: unless-stopped
    environment:
      TZ: ${BACKUP_TZ}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE}
      BACKUP_KEEP: ${BACKUP_KEEP}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS}
      BACKUP_UID: ${BACKUP_UID}
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ${BACKUP_DIR}:/backups
      - ${UPLOADS_DATA_DIR}:/sources/uploads
      - ${GRAFANA_DATA_DIR}:/sources/grafana
      - ${CERTS_DATA_DIR}:/sources/certs
      - ./.env:/sources/env:ro
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 1m
      timeout: 10s
      start_period: 2m

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_NGINX}
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_HOST: ${FRONTEND_HOST}
      FRONTEND_PORT: ${FRONTEND_PORT}
      PROMETHEUS_USER: ${PROMETHEUS_USER}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD}
    ports:
      - "${HTTPS_PORT}:${NGINX_HTTPS_PORT}"
    volumes:
      - ${CERTS_DATA_DIR}:/etc/nginx/certs
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://127.0.0.1:${NGINX_HTTPS_PORT}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-network:
    name: ${NETWORK_NAME}
    driver: bridge
