services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_DB}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DB_DATA_DIR}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ${CONTAINER_NAME_BACKEND}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      SEED_SA_EMAIL: ${SEED_SA_EMAIL}
      SEED_SA_PASSWORD: ${SEED_SA_PASSWORD}
    volumes:
      - ${UPLOADS_DATA_DIR}:/app/uploads
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ${CONTAINER_NAME_FRONTEND}
    restart: unless-stopped
    networks:
      - app-network

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_PROMETHEUS}
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL}"
    volumes:
      - ${PROMETHEUS_DATA_DIR}:/prometheus
    networks:
      - app-network
    depends_on:
      - backend

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_GRAFANA}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_USERS_ALLOW_SIGN_UP}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_SECURITY_COOKIE_SECURE}
      GF_SERVER_ROOT_URL: ${GRAFANA_SERVER_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVER_SERVE_FROM_SUB_PATH}
    volumes:
      - ${GRAFANA_DATA_DIR}:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus

  node-exporter:
    build:
      context: ./node-exporter
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_NODE_EXPORTER}
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - app-network

  postgres-exporter:
    build:
      context: ./postgres-exporter
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_POSTGRES_EXPORTER}
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME}
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_NGINX}
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_HOST: ${FRONTEND_HOST}
      FRONTEND_PORT: ${FRONTEND_PORT}
      PROMETHEUS_USER: ${PROMETHEUS_USER}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD}
    ports:
      - "${HTTPS_PORT}:${NGINX_HTTPS_PORT}"
    volumes:
      - ${CERTS_DATA_DIR}:/etc/nginx/certs
    networks:
      - app-network
    depends_on:
      - backend
      - frontend
      - prometheus
      - grafana

networks:
  app-network:
    name: ${NETWORK_NAME}
    driver: bridge
