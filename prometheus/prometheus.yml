global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

# Alerting rules specification
rule_files:
  - "/etc/prometheus/alert.rules.yml"

# Scrape configurations
scrape_configs:
  # 1. Prometheus Internal Scraper
  - job_name: "prometheus"
    metrics_path: "/prometheus/metrics"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Trenno Express Backend Application Metrics
  - job_name: "trenno-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3000"]
    relabel_configs:
      - target_label: instance
        replacement: "trenno-backend"

  # 3. Node / Host System Metrics Exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - target_label: instance
        replacement: "trenno-host"

  # 4. PostgreSQL Database Metrics Exporter
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - target_label: instance
        replacement: "trenno-postgres"
